<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Color Palette</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <div class="container">
      <h1>Color Palette Generator</h1>

      <button id="generate-btn">Generate Palette</button>

      <div class="palette-container">
        <!-- Color Box 1 -->
        <div class="color-box">
          <div class="color" style="background-color: #e1f5fe;"></div>
          <div class="color-info">
            <span class="hex-value">#e1f5fe</span>
          </div>
        </div>

        <!-- Color Box 2 -->
        <div class="color-box">
          <div class="color" style="background-color: #75DBCD;"></div>
          <div class="color-info">
            <span class="hex-value">#75DBCD</span>
          </div>
        </div>

        <!-- Color Box 3 -->
        <div class="color-box">
          <div class="color" style="background-color: #C9DBBA;"></div>
          <div class="color-info">
            <span class="hex-value">#C9DBBA</span>
          </div>
        </div>

        <!-- Color Box 4 -->
        <div class="color-box">
          <div class="color" style="background-color: #DCDBA8;"></div>
          <div class="color-info">
            <span class="hex-value">#DCDBA8</span>
          </div>
        </div>

        <!-- Color Box 5 -->
        <div class="color-box">
          <div class="color" style="background-color: #F5CDA7;"></div>
          <div class="color-info">
            <span class="hex-value">#F5CDA7</span>
          </div>
        </div>

      </div>

    </div>
    <script src="./script.js"></script>
  </body>
</html>
